services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: tara
      POSTGRES_DB: tara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tara"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql+psycopg://tara:tara@postgres:5432/tara
      QOREID_CLIENT_ID: ${QOREID_CLIENT_ID:-}
      QOREID_API_KEY: ${QOREID_API_KEY:-}
      QOREID_BASE_URL: ${QOREID_BASE_URL:-https://api.qoreid.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
